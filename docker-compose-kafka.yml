version: '3.8'

services:

  # ─── Zookeeper Cluster (3 nodos) ───────────────────────────────────────────

  zookeeper1:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper1
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: "zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888"
    ports:
      - "2181:2181"
    networks:
      - kafka-network

  zookeeper2:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper2
    environment:
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_CLIENT_PORT: 2182
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: "zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888"
    ports:
      - "2182:2182"
    networks:
      - kafka-network

  zookeeper3:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper3
    environment:
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_CLIENT_PORT: 2183
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: "zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888"
    ports:
      - "2183:2183"
    networks:
      - kafka-network

  # ─── Kafka Cluster (3 brokers) ─────────────────────────────────────────────

  kafka1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka1
    depends_on:
      - zookeeper1
      - zookeeper2
      - zookeeper3
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper1:2181,zookeeper2:2182,zookeeper3:2183"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - kafka-network

  kafka2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka2
    depends_on:
      - zookeeper1
      - zookeeper2
      - zookeeper3
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper1:2181,zookeeper2:2182,zookeeper3:2183"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29093,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29093,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - kafka-network

  kafka3:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka3
    depends_on:
      - zookeeper1
      - zookeeper2
      - zookeeper3
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper1:2181,zookeeper2:2182,zookeeper3:2183"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29094,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29094,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - kafka-network

  # ─── Kafka UI ──────────────────────────────────────────────────────────────

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    ports:
      - "9000:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: transporte-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29093,kafka3:29094
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper1:2181
    networks:
      - kafka-network

  # ─── Microservicio Productor de Ubicaciones ────────────────────────────────

  ms-kafka-productor-ubicaciones:
    build:
      context: ./backend/ms-kafka-productor-ubicaciones
      dockerfile: Dockerfile
    container_name: ms-kafka-productor-ubicaciones
    ports:
      - "8087:8087"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka1:29092,kafka2:29093,kafka3:29094
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    networks:
      - kafka-network
    restart: unless-stopped

  # ─── Microservicio de Procesamiento (consumer + producer) ─────────────────

  ms-kafka-procesamiento:
    build:
      context: ./backend/ms-kafka-procesamiento
      dockerfile: Dockerfile
    container_name: ms-kafka-procesamiento
    ports:
      - "8088:8088"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka1:29092,kafka2:29093,kafka3:29094
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    networks:
      - kafka-network
    restart: unless-stopped

  # ─── Microservicio Consumidor GPS (guarda en Oracle) ──────────────────────

  ms-kafka-consumidor-gps:
    build:
      context: ./backend/ms-kafka-consumidor-gps
      dockerfile: Dockerfile
    container_name: ms-kafka-consumidor-gps
    ports:
      - "8089:8089"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka1:29092,kafka2:29093,kafka3:29094
      - ORACLE_PASSWORD=${ORACLE_PASSWORD}
      - ORACLE_TNS_NAME=${ORACLE_TNS_NAME}
      - ORACLE_USER=${ORACLE_USER}
      - ORACLE_WALLET_PATH=/wallet
      - ORACLE_WALLET_PASSWORD=${ORACLE_WALLET_PASSWORD}
      - TNS_ADMIN=/wallet
    volumes:
      - ./backend/wallet/Wallet_TRANSPORTEDB:/wallet:ro
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    networks:
      - kafka-network
    restart: unless-stopped

  # ─── Microservicio Consumidor Horarios (guarda en Oracle) ─────────────────

  ms-kafka-consumidor-horarios:
    build:
      context: ./backend/ms-kafka-consumidor-horarios
      dockerfile: Dockerfile
    container_name: ms-kafka-consumidor-horarios
    ports:
      - "8090:8090"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka1:29092,kafka2:29093,kafka3:29094
      - ORACLE_PASSWORD=${ORACLE_PASSWORD}
      - ORACLE_TNS_NAME=${ORACLE_TNS_NAME}
      - ORACLE_USER=${ORACLE_USER}
      - ORACLE_WALLET_PATH=/wallet
      - ORACLE_WALLET_PASSWORD=${ORACLE_WALLET_PASSWORD}
      - TNS_ADMIN=/wallet
    volumes:
      - ./backend/wallet/Wallet_TRANSPORTEDB:/wallet:ro
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    networks:
      - kafka-network
    restart: unless-stopped

networks:
  kafka-network:
    driver: bridge
